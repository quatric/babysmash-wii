name: Build

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 make ca-certificates espeak-ng ffmpeg zip

      - name: Build GRRLIB and controller libraries (libwiidrc, libwupc, libsicksaxis)
        run: |
          ./scripts/build_controller_portlibs.sh
          ./scripts/build_grrlib.sh

      - name: Build boot.dol
        run: make

      - name: Synthesise dictionary word clips (espeak-ng)
        run: ENGINE=espeak-ng ./scripts/gen_speech.sh --words

      - name: Package (SD card layout)
        run: |
          make dist
          cp README.md LICENSE LICENSE.babysmash dist/apps/babysmash/
          mkdir -p out && cp -R dist/apps out/apps

      - uses: actions/upload-artifact@v4
        with:
          name: babysmash-wii
          path: out/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          (cd out && zip -r ../babysmash-wii.zip apps)
          echo "release asset: babysmash-wii.zip"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: babysmash-wii.zip
