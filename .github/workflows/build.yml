name: Build

permissions:
  contents: write

on:
  push:
    tags-ignore: [latest]
  pull_request:
  workflow_dispatch:

jobs:
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 make ca-certificates espeak-ng ffmpeg zip

      - name: Build GRRLIB and controller libraries (libwiidrc, libwupc, libsicksaxis)
        run: |
          ./scripts/build_controller_portlibs.sh
          ./scripts/build_grrlib.sh

      - name: Build boot.dol
        run: make

      - name: Synthesise dictionary word clips (espeak-ng)
        run: ENGINE=espeak-ng ./scripts/gen_speech.sh --words

      - name: Package (SD card layout)
        run: |
          make dist
          cp README.md LICENSE LICENSE.babysmash dist/apps/babysmash/
          mkdir -p out && cp -R dist/apps out/apps

      - uses: actions/upload-artifact@v4
        with:
          name: babysmash-wii
          path: out/
      - name: Zip the release
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
          (cd out && zip -r "$GITHUB_WORKSPACE/babysmash-wii.zip" apps)
      - uses: actions/upload-artifact@v4
        with:
          name: release-babysmash-wii
          if-no-files-found: error
          path: |
            babysmash-wii.zip

  # Every push to the default branch refreshes the "latest" release; tags like v1.2.0 also get their own release.
  release:
    needs: wii
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-babysmash-wii
          path: out
      - name: Move the latest tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BabySmash for Wii (latest)
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Latest build of BabySmash for Wii from ${{ github.sha }}.

            Extract babysmash-wii.zip to the root of your SD card (or USB drive) and open BabySmash for Wii from the Homebrew Channel.
          files: |
            out/babysmash-wii.zip
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: BabySmash for Wii ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Extract babysmash-wii.zip to the root of your SD card (or USB drive) and open BabySmash for Wii from the Homebrew Channel.
          files: |
            out/babysmash-wii.zip
